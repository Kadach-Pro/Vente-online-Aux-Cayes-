<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Boutique</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Ma Boutique</h1>
        <nav>
            <div class="panye">
  🛒 Panye (<span id="konpteur">0</span>)
</div>
            <a href="#">Rad</a>
            <a href="#">Tenis</a>
            <a href="#">Boxer</a>
        </nav>

    </header>

    <main>
        <article class="produit">
            <img src="tenis1.jpg" alt="Tenis Nike Air blan ak nwa">
            <h2>Tenis Nike Air</h2>
            <p class="prix">2 500 HTG</p>
            <button type="button" onclick="ajoutePanye('Tenis Nike Air', 2500)">Achte</button>
        </article>
  <article class="produit">
    <img src="sandale1.jpg" alt="Sandale">
    <h2>Sandale</h2>
    <p class="prix">800 HTG</p>
    <button type="button" onclick="ajoutePanye('Sandale', 800)">Achte</button>
</article>

<article class="produit">
    <img src="chemiz1.jpg" alt="Chemiz">
    <h2>Chemiz</h2>
    <p class="prix">1200 HTG</p>
    <button type="button" onclick="ajoutePanye('Chemiz', 1200)">Achte</button>
</article>  
    </main>

    <footer>
        <p>Kontak nou: +509 43624063</p>
    </footer>
<script>
  let panye = [];

  function ajoutePanye(non, pri) {
    panye.push({ non: non, pri: pri });
    document.getElementById('konpteur').textContent = panye.length;
    alert(non + " ajoute nan panye w!");
  }
</script>
</body>
</html>
